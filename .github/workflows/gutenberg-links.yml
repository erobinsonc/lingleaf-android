# Weekly: every recommended book's text and cover still download from Project
# Gutenberg's file cache (SPEC "Book downloads"). The ids come from SPEC.md, so the
# check follows the list. A failure opens nothing; it shows as a red run.
name: Gutenberg links

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check recommended books
        run: |
          ids=$(sed -n '/^- Recommended books/,/Levels:/p' SPEC.md | sed 's/Levels:.*//' | grep -oE '\b[0-9]{2,5}\b' | sort -u)
          test -n "$ids"
          failed=0
          for id in $ids; do
            for url in "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" "https://www.gutenberg.org/cache/epub/$id/pg$id.cover.medium.jpg"; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$url")
              echo "$status $url"
              [ "$status" = "200" ] || failed=1
            done
          done
          exit $failed
