name: Screenshots

# Runs the real app on an Android emulator, walks every screen with
# Maestro (.maestro/tour.yaml) in light and dark mode, and publishes the
# images to the `screenshots` branch under android/<branch>/.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "2.10.0"

jobs:
  emulator:
    name: Emulator tour (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./.github/scripts/emulator-tour.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: screenshots
          if-no-files-found: ignore

  publish:
    name: Publish screenshots
    needs: emulator
    if: always() && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-screenshots
          path: screenshots
      - run: ./.github/scripts/publish-screenshots.sh android "${{ github.head_ref || github.ref_name }}" "${{ github.event.pull_request.head.sha || github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
